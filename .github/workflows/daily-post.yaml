name: Daily Automated Post

on:
  schedule:
    - cron: '0 23 * * *' # Daily at 23:00 UTC (08:00 JST)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  create-daily-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set Date
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Generate blog post
        id: generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/generate_daily_post.py

      - name: Create Pull Request
        id: create-pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat: add daily automated blog post"
          title: "Daily Blog Post: ${{ steps.generate.outputs.post_title }}"
          body: |
            This PR adds an automatically generated blog post based on recent news.
            Please review and edit before merging.

            **Topic:** ${{ steps.generate.outputs.post_title }}

            Generated by Gemini.
          branch: "daily-post/auto-generated-${{ env.DATE }}"
          base: "master"
          delete-branch: true
          labels: |
            AI-generated
            automerge-24h

      - name: Approve pending workflow runs for the new PR
        if: steps.create-pr.outputs.pull-request-operation == 'created'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # PRs opened by github-actions[bot] have their pull_request-triggered
          # workflows (build/test) gated behind manual approval. Approve them
          # here so CI runs immediately, without waiting for automerge.yaml's
          # next scheduled tick.
          branch="daily-post/auto-generated-${{ env.DATE }}"

          run_ids=""
          for i in $(seq 1 10); do
            run_ids=$(gh api "repos/${{ github.repository }}/actions/runs?branch=$branch&event=pull_request" --jq '.workflow_runs[] | select(.conclusion=="action_required") | .id')
            if [ -n "$run_ids" ]; then
              break
            fi
            echo "No pending runs found yet, retrying in 5s..."
            sleep 5
          done

          for run_id in $run_ids; do
            echo "Approving pending run $run_id..."
            gh api -X POST "repos/${{ github.repository }}/actions/runs/$run_id/approve" || echo "Failed to approve run $run_id."
          done
