# Sample workflow for building and deploying a Hugo site to GitHub Pages
name: Deploy Hugo site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches:
      - master
  pull_request:
    branches:
      - '*'
  schedule:
    - cron: '0 0 * * *'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment per ref, skipping runs queued between the run
# in-progress and latest queued. Scoping by ref (rather than a single global "pages"
# group) prevents unrelated PR builds from cancelling each other's queued runs, which
# otherwise leaves the required "build" status check permanently unreported.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-22.04
    env:
      HUGO_VERSION: 0.164.0
    outputs:
      indexnow_urls: ${{ steps.indexnow-urls.outputs.urls }}
      indexnow_key: ${{ steps.indexnow-key.outputs.key }}
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      # The IndexNow key must be readable by search engines at
      # static/<key>.txt, so that file is the single source of truth. Read it
      # here (the deploy job has no checkout) instead of duplicating the
      # value as a literal in the workflow, which would risk drifting out of
      # sync with the committed key file if the key is ever rotated.
      - name: Read IndexNow key
        id: indexnow-key
        run: |
          key_file=$(find static -maxdepth 1 -name '*.txt')
          echo "key=$(cat "$key_file")" >> "$GITHUB_OUTPUT"
      # Only a push carries a meaningful before/after commit range; schedule and
      # workflow_dispatch runs have no content diff to compute, so IndexNow has
      # nothing new to learn about and the step is skipped for those triggers.
      - name: Compute changed post URLs for IndexNow
        id: indexnow-urls
        if: github.event_name == 'push'
        run: |
          urls=""
          before="${{ github.event.before }}"
          after="${{ github.event.after }}"
          if git rev-parse --verify -q "${before}^{commit}" >/dev/null && git rev-parse --verify -q "${after}^{commit}" >/dev/null; then
            while IFS=$'\t' read -r st path; do
              case "$st" in
                A|M) ;;
                *) continue ;;
              esac
              case "$path" in
                content/posts/*.md) ;;
                *) continue ;;
              esac
              case "$path" in
                */_index.md) continue ;;
              esac
              rel="${path#content/posts/}"
              rel="${rel%.md}"
              urls="${urls}https://kuchida1981.github.io/posts/${rel}/,"
            done < <(git diff --name-status "$before" "$after" -- content/posts)
          else
            echo "::warning::Skipping IndexNow diff: before ($before) or after ($after) is not a resolvable commit (e.g. force-push or new branch). No notification will be sent for this push."
          fi
          urls="${urls%,}"
          echo "urls=$urls" >> "$GITHUB_OUTPUT"
      - name: Correct stale publish dates for new posts
        id: correct-dates
        if: github.event_name == 'push'
        run: |
          before="${{ github.event.before }}"
          after="${{ github.event.after }}"
          files_to_check=""
          if git rev-parse --verify -q "${before}^{commit}" >/dev/null && git rev-parse --verify -q "${after}^{commit}" >/dev/null; then
            while IFS=$'\t' read -r st path; do
              if [ "$st" != "A" ]; then
                continue
              fi
              case "$path" in
                content/posts/*.md) ;;
                *) continue ;;
              esac
              case "$path" in
                */_index.md) continue ;;
              esac
              files_to_check="$files_to_check $path"
            done < <(git diff --name-status "$before" "$after" -- content/posts)
          else
            echo "::warning::Skipping date correction diff: before ($before) or after ($after) is not a resolvable commit."
          fi
          if [ -n "$files_to_check" ]; then
            echo "Files to check: $files_to_check"
            python3 scripts/correct_publish_dates.py $files_to_check
            if [ -n "$(git status --porcelain -- $files_to_check)" ]; then
              echo "changes_made=true" >> "$GITHUB_OUTPUT"
            else
              echo "changes_made=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "No added posts found in this push."
            echo "changes_made=false" >> "$GITHUB_OUTPUT"
          fi
          echo "files_to_check=$files_to_check" >> "$GITHUB_OUTPUT"

      - name: Commit and push corrected dates
        if: github.event_name == 'push' && steps.correct-dates.outputs.changes_made == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ steps.correct-dates.outputs.files_to_check }}
          git commit -m "feat: correct stale publish dates on push"
          if ! git push origin master; then
            echo "Push failed. Attempting to rebase and push again..."
            if ! git pull --rebase origin master; then
              echo "::warning::Failed to rebase origin master. Continuing build without pushing changes."
            else
              if ! git push origin master; then
                echo "::warning::Failed to push date correction. Continuing build without pushing changes."
              fi
            fi
          fi

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Install Node.js dependencies
        run: npm install -g sass && [[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true
      - name: Build with Hugo
        env:
          # For maximum backward compatibility with Hugo modules
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Notify IndexNow of changed posts
        if: needs.build.outputs.indexnow_urls != ''
        continue-on-error: true
        env:
          INDEXNOW_KEY: ${{ needs.build.outputs.indexnow_key }}
          INDEXNOW_URLS: ${{ needs.build.outputs.indexnow_urls }}
        run: |
          url_list=$(echo "$INDEXNOW_URLS" | tr ',' '\n' | jq -R . | jq -s .)
          body=$(jq -n \
            --arg host "kuchida1981.github.io" \
            --arg key "$INDEXNOW_KEY" \
            --arg keyLocation "https://kuchida1981.github.io/${INDEXNOW_KEY}.txt" \
            --argjson urlList "$url_list" \
            '{host: $host, key: $key, keyLocation: $keyLocation, urlList: $urlList}')
          curl -s -o /dev/null -w "IndexNow response: %{http_code}\n" \
            -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$body"
