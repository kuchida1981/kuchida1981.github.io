name: Correct Manual Post Dates

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - master

permissions:
  contents: write
  pull-requests: read

jobs:
  correct-dates:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Correct publish dates of added posts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          # Re-check the label live via the API rather than trusting the
          # webhook payload's labels snapshot: peter-evans/create-pull-request
          # creates the PR and adds labels as separate sequential API calls,
          # so the `opened` event payload can still be missing the
          # automerge-24h label at the moment this workflow starts even
          # though the label is added moments later. automerge.yaml owns
          # date correction for those PRs, so skip here to avoid a redundant
          # (and racy) early correction commit.
          labels=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name')
          if echo "$labels" | grep -qx "automerge-24h"; then
            echo "PR #$PR_NUMBER is managed by automerge.yaml (automerge-24h label). Skipping."
            exit 0
          fi

          # Identify newly added files in the PR
          files_to_check=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER/files" --paginate --jq '.[] | select(.status=="added") | .filename' | grep -E '^content/posts/.*\.md$' | grep -v '_index.md' || true)

          if [ -n "$files_to_check" ]; then
            echo "Found added post files: $files_to_check"
            
            # Fetch and checkout the PR branch
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" origin/"$BRANCH"
            
            # Correct publish dates (JST +09:00)
            python3 scripts/correct_publish_dates.py $files_to_check
            
            if [ -n "$(git status --porcelain -- $files_to_check)" ]; then
              echo "Date correction applied. Committing and pushing..."
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add $files_to_check
              git commit -m "feat: correct publish date of manual post"
              
              if ! git push origin HEAD:"$BRANCH"; then
                echo "Push failed. Attempting to rebase and push again..."
                if ! git pull --rebase origin "$BRANCH"; then
                  echo "::warning::Failed to rebase branch $BRANCH. Continuing without pushing date correction."
                else
                  if ! git push origin HEAD:"$BRANCH"; then
                    echo "::warning::Failed to push date correction to branch $BRANCH. Continuing."
                  fi
                fi
              fi
            else
              echo "No date correction needed."
            fi
          else
            echo "No new post files found in PR #$PR_NUMBER. Skipping date correction."
          fi
