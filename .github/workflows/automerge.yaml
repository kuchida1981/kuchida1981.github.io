name: Auto-Merge AI Posts

on:
  schedule:
    - cron: '17 */3 * * *' # Run every hour
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Approve pending workflow runs on eligible PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # PRs opened by github-actions[bot] (e.g. daily-post) require manual
          # approval before their pull_request-triggered workflows can run.
          # Approve them here so CI has time to complete before the 24h merge
          # check below.
          prs=$(gh pr list --label "automerge-24h" --json number,headRefName --state open)

          echo "$prs" | jq -c '.[]' | while read -r pr; do
            number=$(echo "$pr" | jq -r '.number')
            branch=$(echo "$pr" | jq -r '.headRefName')

            run_ids=$(gh api "repos/${{ github.repository }}/actions/runs?branch=$branch&event=pull_request" --jq '.workflow_runs[] | select(.conclusion=="action_required") | .id')

            for run_id in $run_ids; do
              echo "Approving pending run $run_id for PR #$number..."
              gh api -X POST "repos/${{ github.repository }}/actions/runs/$run_id/approve" || echo "Failed to approve run $run_id for PR #$number."
            done
          done

      - name: Auto-merge eligible PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Record the current commit to return to it later. actions/checkout
          # leaves the runner in a detached HEAD state, so `--abbrev-ref HEAD`
          # would literally return the string "HEAD" (not a real ref), making
          # a later `git checkout "$default_branch"` a no-op instead of an
          # actual return to this commit. Capture the SHA instead.
          default_branch=$(git rev-parse HEAD)

          # Find PRs with label 'automerge-24h'
          prs=$(gh pr list --label "automerge-24h" --json number,createdAt,mergeable,headRefName --state open)
          
          # Parse JSON and iterate
          echo "$prs" | jq -c '.[]' | while read -r pr; do
            number=$(echo "$pr" | jq -r '.number')
            created_at=$(echo "$pr" | jq -r '.createdAt')
            mergeable=$(echo "$pr" | jq -r '.mergeable')
            branch=$(echo "$pr" | jq -r '.headRefName')
            
            echo "Checking PR #$number created at $created_at..."
            
            # Check if 24 hours have passed
            created_ts=$(date -d "$created_at" +%s)
            current_ts=$(date +%s)
            diff=$((current_ts - created_ts))
            
            # 24 hours in seconds = 86400
            if [ "$diff" -ge 86400 ]; then
              echo "PR #$number is older than 24 hours ($diff seconds)."
              
              if [ "$mergeable" == "CONFLICTING" ]; then
                echo "PR #$number has conflicts. Skipping."
                continue
              fi

              # Identify newly added files in the PR
              files_to_check=$(gh api --paginate "repos/${{ github.repository }}/pulls/$number/files" --jq '.[] | select(.status=="added") | .filename' | grep -E '^content/posts/.*\.md$' | grep -v '_index.md' || true)

              if [ -n "$files_to_check" ]; then
                echo "Found added post files in PR #$number: $files_to_check"
                
                # Fetch and checkout the PR branch
                git fetch origin "$branch"
                git checkout -B "$branch" origin/"$branch"
                
                # Correct publish dates (JST +09:00)
                python3 scripts/correct_publish_dates.py $files_to_check
                
                if [ -n "$(git status --porcelain -- $files_to_check)" ]; then
                  echo "Date correction applied. Committing and pushing..."
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add $files_to_check
                  git commit -m "feat: correct publish date before automerge"
                  if ! git push origin HEAD:"$branch"; then
                    echo "Push failed. Attempting to rebase and push again..."
                    if ! git pull --rebase origin "$branch"; then
                      echo "::warning::Failed to rebase branch $branch. Continuing without pushing date correction."
                    else
                      if ! git push origin HEAD:"$branch"; then
                        echo "::warning::Failed to push date correction to branch $branch. Continuing."
                      fi
                    fi
                  fi
                else
                  echo "No date correction needed."
                fi
                
                # Switch back to the default branch
                git checkout "$default_branch"
              else
                echo "No new post files found in PR #$number. Skipping date correction."
              fi

              # Attempt merge
              echo "Attempting to merge PR #$number..."
              if gh pr merge "$number" --merge --delete-branch; then
                echo "Successfully merged PR #$number."
                # Trigger immediate deploy
                echo "Triggering immediate deploy workflow hugo.yaml..."
                gh workflow run hugo.yaml
              else
                echo "Failed to merge PR #$number. Status checks might be failing."
              fi
            else
              echo "PR #$number is not yet 24 hours old. Skipping."
            fi
          done
